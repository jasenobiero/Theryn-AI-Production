    # ── Shield schemas ─────────────────────────────────────
    SocialAccount:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        platform:
          type: string
          description: Supported platform identifier; saving a handle does not connect an account
        handle:
          type: string
          maxLength: 200
        displayName:
          type: string
          maxLength: 100
          nullable: true
        riskScore:
          type: integer
        lastScannedAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, userId, platform, handle, riskScore, isActive, createdAt]
    AddShieldAccountBody:
      type: object
      properties:
        platform:
          type: string
          enum:
            - tiktok
            - instagram
            - youtube
            - twitter
            - discord
            - discord_server
            - reddit
            - facebook
            - linkedin
            - twitch
            - snapchat
            - github
            - telegram
            - spotify
        handle:
          type: string
          minLength: 1
          maxLength: 200
        displayName:
          type: string
          maxLength: 100
      required: [platform, handle]
    SecurityAlert:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        accountId:
          type: integer
          nullable: true
        type:
          type: string
        severity:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, severity, title, message, isRead, createdAt]
    ShieldThreat:
      type: object
      properties:
        type:
          type: string
          maxLength: 80
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 1000
      required: [type, severity, title, description]
    ShieldAnalysis:
      description: AI-generated general platform guidance; no individual profile is inspected.
      type: object
      properties:
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Subjective estimate of general platform risks, not an account finding
        riskLevel:
          type: string
          enum: [safe, low, medium, high, critical]
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        threats:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ShieldThreat"
        recommendations:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
      required: [riskScore, riskLevel, summary, threats, recommendations]
    ShieldScanResult:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/SocialAccount"
        analysis:
          $ref: "#/components/schemas/ShieldAnalysis"
      required: [account, analysis]
