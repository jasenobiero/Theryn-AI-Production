kind = "web"
previewPath = "/"
title = "AI Hub"
description = "A multi-provider AI command center with streaming chat, image generation, voice synthesis, custom agents, and workspace tools."
version = "1.0.0"
id = "artifacts/ai-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25028

[services.development]
run = "pnpm --filter @workspace/ai-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25028"
BASE_PATH = "/"
